version: 2.1

jobs:
  check-build-machine:
    machine:
      image: ubuntu-2204:current
    resource_class: xlarge.gen3

    steps:
      - checkout

      - run:
          name: Check machine resources
          command: |
            echo "===== CPU ====="
            nproc
            lscpu | grep -E 'Model name|CPU\(s\)'

            echo "===== MEMORY ====="
            free -h

            echo "===== DISK ====="
            df -h /

            echo "===== OS ====="
            cat /etc/os-release

      - run:
          name: Check Android and Chromium prerequisites
          command: |
            echo "Checking basic build environment..."
            git --version
            python3 --version
            java -version || true

workflows:
  universal-browser-machine-test:
    jobs:
      - check-build-machine