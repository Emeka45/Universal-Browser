name: Media and AI Upgrade

on:
  push:
    paths:
      - 'tools/integrate_media_ai_upgrade.py'
      - 'app/src/main/java/com/coeric/universalbrowser/AdvancedMediaDownloadEngine.kt'
      - 'ai-gateway/**'
      - '.github/workflows/media-ai-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply Android integration
        run: python3 tools/integrate_media_ai_upgrade.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Universal Browser
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Commit Android integration
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/coeric/universalbrowser/MainActivity.kt
            git commit -m "feat: integrate advanced media downloader"
            git push
          fi
