name: Fix Swipe Back Navigation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    if: "!contains(github.event.head_commit.message, '[swipe-fix-applied]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Repair Android back navigation source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('app/src/main/java/com/coeric/universalbrowser/MainActivity.kt')
          text = main.read_text()

          if 'import android.os.Build' not in text:
              text = text.replace('import android.os.Bundle\n', 'import android.os.Build\nimport android.os.Bundle\n', 1)

          # The source may already contain a fully-qualified OnBackInvokedCallback.
          # Detect the actual callback declaration rather than only the imported type,
          # otherwise this workflow injects a second systemBackCallback and breaks the build.
          has_back_callback = 'systemBackCallback' in text
          if not has_back_callback:
              if 'import android.window.OnBackInvokedCallback' not in text:
                  text = text.replace('import android.view.Gravity\n', 'import android.view.Gravity\nimport android.window.OnBackInvokedCallback\n', 1)
              callback = '''\n    private val systemBackCallback = OnBackInvokedCallback {\n        when {\n            canGoBack -> activeSession()?.goBack()\n            homePanel.visibility == View.VISIBLE -> finish()\n            else -> showHome()\n        }\n    }\n'''
              marker = '    private var lastMediaPromptAt = 0L\n'
              if marker not in text:
                  raise SystemExit('Could not find MainActivity state marker')
              text = text.replace(marker, marker + callback, 1)

          # Remove the stale callback injected by the previous workflow. It referenced
          # the old single-session field and caused duplicate declarations.
          text = re.sub(
              r'\n    private val systemBackCallback = OnBackInvokedCallback \{\n        if \(::session\.isInitialized && canGoBack\) \{\n            session\.goBack\(\)\n        \} else \{\n            finish\(\)\n        \}\n    \}\n',
              '\n',
              text,
              count=1,
          )

          # Remove the stale pre-tab-manager onBackPressed implementation if present.
          text = re.sub(
              r'\n    @Suppress\("DEPRECATION"\)\n    override fun onBackPressed\(\) \{\n        // Android 12 and earlier route the system edge-back gesture here\.\n        // Prefer GeckoView history and only leave the activity at the root\.\n        if \(::session\.isInitialized && canGoBack\) \{\n            session\.goBack\(\)\n        \} else \{\n            super\.onBackPressed\(\)\n        \}\n    \}\n',
              '\n',
              text,
              count=1,
          )

          if 'registerOnBackInvokedCallback' not in text:
              marker = '        setContentView(root)\n'
              insertion = '''        setContentView(root)\n\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {\n            onBackInvokedDispatcher.registerOnBackInvokedCallback(\n                android.window.OnBackInvokedDispatcher.PRIORITY_DEFAULT,\n                systemBackCallback\n            )\n        }\n'''
              if marker not in text:
                  raise SystemExit('Could not find setContentView marker')
              text = text.replace(marker, insertion, 1)

          # Keep the existing tab-aware onBackPressed implementation when present.
          if 'override fun onBackPressed()' not in text:
              marker = '    private fun restoreTabs() {'
              insertion = '''    @Suppress("DEPRECATION")\n    override fun onBackPressed() {\n        when {\n            canGoBack -> activeSession()?.goBack()\n            homePanel.visibility == View.VISIBLE -> super.onBackPressed()\n            else -> showHome()\n        }\n    }\n\n'''
              if marker not in text:
                  raise SystemExit('Could not find restoreTabs marker')
              text = text.replace(marker, insertion + marker, 1)

          main.write_text(text)

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if 'android:enableOnBackInvokedCallback=' not in m:
              m = m.replace('android:allowBackup="true">', 'android:allowBackup="true"\n        android:enableOnBackInvokedCallback="true">', 1)
          manifest.write_text(m)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Verify Gradle
        run: gradle --version

      - name: Build patched browser
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          echo "APK: $apk"
          file "$apk"
          du -h "$apk"

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/coeric/universalbrowser/MainActivity.kt app/src/main/AndroidManifest.xml
          if git diff --cached --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git commit -m "fix: make Android swipe back navigate browser history [swipe-fix-applied]"
          git push

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-browser-swipe-back-fix
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
