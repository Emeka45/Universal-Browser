name: Repair and Build Universal Browser

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair malformed Kotlin string literals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/coeric/universalbrowser/MainActivity.kt')
          s = p.read_text()
          s = s.replace('\\\n', '\\n')
          s = s.replace('setSingleLine()', 'isSingleLine = true')
          p.write_text(s)
          PY

      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/coeric/universalbrowser/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No source repair changes required."
          else
            git commit -m "fix: repair Universal Browser Kotlin build errors"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-browser-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
