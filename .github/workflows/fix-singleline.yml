name: Fix MainActivity singleLine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Fix EditText singleLine compilation errors'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix EditText singleLine compilation issue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/coeric/universalbrowser/MainActivity.kt')
          s = p.read_text()
          old = 'singleLine = true'
          new = 'setSingleLine(true)'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 singleLine assignments, found {count}')
          p.write_text(s.replace(old, new))
          print(f'Replaced {count} singleLine assignments')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/coeric/universalbrowser/MainActivity.kt
          git commit -m 'Fix EditText singleLine compilation errors'
          git push origin HEAD:main
