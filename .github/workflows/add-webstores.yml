name: Universal Browser Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Build Universal Browser
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify one universal APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/debug -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1
          echo "Universal APK: ${apks[0]}"
          du -h "${apks[0]}"

      - name: Upload Universal Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-browser-universal-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
