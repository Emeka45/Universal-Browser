name: Build Universal Browser

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Update Titanium
        run: |
          cd vanadium
          git fetch --tags
          git checkout "$(git tag | sort -V | tail -n1)"
          cd ..

          git add vanadium

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --staged --quiet; then
            git commit -m "update Titanium"
            git push
          fi

      - name: Set environment
        run: |
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> "$GITHUB_ENV"

      - name: Generate temporary signing credentials
        run: |
          mkdir -p "$RUNNER_TEMP/signing"

          STORE_PASSWORD=$(openssl rand -hex 32)
          KEY_PASSWORD=$(openssl rand -hex 32)

          keytool -genkeypair \
            -alias universal-browser-dev \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore "$RUNNER_TEMP/signing/test.jks" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Universal Browser, O=Universal Browser, C=NG"

          printf 'keyAlias=universal-browser-dev\nkeyPassword=%s\nstorePassword=%s\n' \
            "$KEY_PASSWORD" \
            "$STORE_PASSWORD" \
            > "$RUNNER_TEMP/signing/local.properties"

          echo "LOCAL_TEST_JKS=$(base64 -w 0 "$RUNNER_TEMP/signing/local.properties")" >> "$GITHUB_ENV"
          echo "STORE_TEST_JKS=$(base64 -w 0 "$RUNNER_TEMP/signing/test.jks")" >> "$GITHUB_ENV"

      - name: Build ARM64 APK
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          ./build.sh

      - name: Collect ARM64 APK
        run: |
          APK=$(find chromium/src/out/release -type f -name '*-arm64-v8a.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: ARM64 APK was not found."
            exit 1
          fi

          VERSION=$(basename "$APK" -arm64-v8a.apk)

          FINAL_NAME="${VERSION}-${{ env.unix_time }}-arm64-v8a.apk"

          mv "$APK" "$FINAL_NAME"

          echo "APK_NAME=$FINAL_NAME" >> "$GITHUB_ENV"

          echo "========================================"
          echo "ARM64 APK:"
          echo "$FINAL_NAME"
          echo "========================================"

          ls -lh "$FINAL_NAME"

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-browser-arm64-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error