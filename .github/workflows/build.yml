name: Build Universal Browser

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Update Titanium
        run: |
          cd vanadium
          git fetch --tags
          git checkout "$(git tag | sort -V | tail -n1)"
          cd ..
          git add vanadium
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --staged --quiet; then
            git commit -m "update Titanium"
            git push
          fi

      - name: Set environment
        run: |
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> "$GITHUB_ENV"

      - name: Generate temporary signing credentials
        run: |
          mkdir -p "$RUNNER_TEMP/signing"

          STORE_PASSWORD=$(openssl rand -hex 32)
          KEY_PASSWORD=$(openssl rand -hex 32)

          keytool -genkeypair \
            -alias universal-browser-dev \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore "$RUNNER_TEMP/signing/test.jks" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Universal Browser, O=Universal Browser, C=NG"

          printf 'keyAlias=universal-browser-dev\nkeyPassword=%s\nstorePassword=%s\n' \
            "$KEY_PASSWORD" "$STORE_PASSWORD" \
            > "$RUNNER_TEMP/signing/local.properties"

          echo "LOCAL_TEST_JKS=$(base64 -w 0 "$RUNNER_TEMP/signing/local.properties")" >> "$GITHUB_ENV"
          echo "STORE_TEST_JKS=$(base64 -w 0 "$RUNNER_TEMP/signing/test.jks")" >> "$GITHUB_ENV"

      - name: Build
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          ./build.sh

      - name: Collect APKs
        run: |
          VERSION=$(find chromium/src/out/release -name '*arm64-v8a.apk' | sed 's/.*\///;s/-arm64-v8a.apk$//')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          mv "$(find chromium/src/out/release -name '*arm64-v8a.apk' | head -n1)" \
            "$VERSION-${{ env.unix_time }}-arm64-v8a.apk"

          mv "$(find chromium/src/out/release -name '*armeabi-v7a.apk' | head -n1)" \
            "$VERSION-${{ env.unix_time }}-armeabi-v7a.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: universal-browser-apks
          path: |
            *-arm64-v8a.apk
            *-armeabi-v7a.apk
