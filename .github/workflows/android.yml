name: Build Universal Browser

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Check runner disk space
        run: df -h

      - name: Show Gradle version
        run: gradle --version

      - name: Build Redmi A1 ARMv7 debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --info

      - name: Verify generated APK architecture
        run: |
          set -e
          apk_count=$(find app/build/outputs/apk/debug -type f -name '*.apk' | wc -l)
          echo "APK count: $apk_count"
          test "$apk_count" -eq 1
          apk=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          echo "APK: $apk"
          du -h "$apk"

      - name: List generated APK
        run: find app/build/outputs/apk -type f -name '*.apk' -print -exec du -h {} \;

      - name: Upload Redmi A1 APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-browser-redmi-a1-armv7
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
