name: Build Universal Browser

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          apk_count=$(find app/build/outputs/apk/debug -type f -name '*.apk' | wc -l)
          echo "APK count: $apk_count"
          test "$apk_count" -eq 1
          apk=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          echo "APK: $apk"
          file "$apk"
          du -h "$apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-browser-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
