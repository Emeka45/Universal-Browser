name: Build Universal Browser

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-browser-build-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7.1'

      - name: Validate current browser source tree
        run: |
          set -euo pipefail
          files=(
            app/src/main/java/com/coeric/universalbrowser/MainActivity.kt
            app/src/main/java/com/coeric/universalbrowser/BrowserTabManager.kt
            app/src/main/java/com/coeric/universalbrowser/BrowserSecurityController.kt
            app/src/main/java/com/coeric/universalbrowser/BrowserPermissionController.kt
            app/src/main/java/com/coeric/universalbrowser/BrowserPowerCenter.kt
            app/src/main/java/com/coeric/universalbrowser/BrowserFeatureCenter.kt
            app/src/main/java/com/coeric/universalbrowser/DownloadCenter.kt
            app/src/main/java/com/coeric/universalbrowser/DownloadService.kt
            app/src/main/java/com/coeric/universalbrowser/TabStateStore.kt
            app/src/main/java/com/coeric/universalbrowser/UniversalBrowserApp.kt
            app/src/main/java/com/coeric/universalbrowser/ExtensionManager.kt
            app/src/main/java/com/coeric/universalbrowser/ExtensionStoreCenter.kt
            app/src/main/java/com/coeric/universalbrowser/MediaBridge.kt
            app/src/main/java/com/coeric/universalbrowser/AdvancedMediaDownloadEngine.kt
            app/src/main/assets/universal_media/manifest.json
            app/src/main/assets/universal_media/media-detector.js
          )
          for f in "${files[@]}"; do test -f "$f" || { echo "Missing required file: $f"; exit 1; }; done
          grep -q 'GeckoView' app/src/main/java/com/coeric/universalbrowser/MainActivity.kt
          grep -q 'GeckoRuntime' app/src/main/java/com/coeric/universalbrowser/UniversalBrowserApp.kt
          grep -q 'savePageAsPdf' app/src/main/java/com/coeric/universalbrowser/BrowserFeatureCenter.kt
          echo 'Universal Browser source validation passed.'

      - name: Check formatting
        run: git diff --check

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify generated universal APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/debug -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          file "$apk"
          du -h "$apk"
          unzip -l "$apk" > apk-contents.txt
          grep -q 'lib/armeabi-v7a/' apk-contents.txt
          grep -q 'lib/arm64-v8a/' apk-contents.txt
          echo "Universal APK verified: $apk"

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-browser-universal-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
