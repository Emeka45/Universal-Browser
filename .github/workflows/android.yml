name: Build Universal Browser

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Check runner disk space
        run: df -h

      - name: Show Gradle version
        run: gradle --version

      - name: Build split debug APKs
        run: gradle assembleDebug --no-daemon --stacktrace --info

      - name: List generated APKs
        run: find app/build/outputs/apk -type f -name '*.apk' -print -exec du -h {} \;

      - name: Upload split debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: universal-browser-debug-split
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
