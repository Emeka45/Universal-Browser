name: Build Universal Browser

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-browser-build-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7.1'

      - name: Validate committed browser features
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/coeric/universalbrowser/AdvancedMediaDownloadEngine.kt
          test -f app/src/main/java/com/coeric/universalbrowser/BrowserSecurityController.kt
          test -f app/src/main/java/com/coeric/universalbrowser/BrowserPermissionController.kt
          test -f app/src/main/java/com/coeric/universalbrowser/BrowserExtensionCenter.kt
          test -f app/src/main/java/com/coeric/universalbrowser/ExtensionCompatibilityEngine.kt
          test -f app/src/main/java/com/coeric/universalbrowser/ExtensionInstallActivity.kt
          test -f app/src/main/java/com/coeric/universalbrowser/BrowserAdvancedTools.kt
          test -f app/src/main/java/com/coeric/universalbrowser/DownloadTaskStore.kt
          test -f app/src/main/java/com/coeric/universalbrowser/TabStateStore.kt
          test -f app/src/main/java/com/coeric/universalbrowser/UniversalBrowserApp.kt
          test -f app/src/main/assets/media-detector/manifest.json
          test -f app/src/main/assets/media-detector/content.js
          test -f app/src/main/assets/media-detector/background.js
          grep -q 'nativeMessagingFromContent' app/src/main/assets/media-detector/manifest.json
          grep -q 'AdvancedMediaDownloadEngine.isSupported' app/src/main/java/com/coeric/universalbrowser/MainActivity.kt
          grep -q 'AdvancedMediaDownloadEngine.enqueue' app/src/main/java/com/coeric/universalbrowser/MainActivity.kt
          grep -q 'BrowserAdvancedTools' app/src/main/java/com/coeric/universalbrowser/BrowserPowerCenter.kt
          grep -q 'BrowserPermissionController.attach' app/src/main/java/com/coeric/universalbrowser/BrowserPowerCenter.kt
          grep -q 'BrowserExtensionCenter.openInstaller' app/src/main/java/com/coeric/universalbrowser/BrowserPowerCenter.kt
          grep -q '/v1/chat' ai-gateway/src/index.js
          if grep -Rqs 'fingerprintingProtection(' app/src/main/java; then exit 1; fi
          echo 'Universal Browser source validation passed.'

      - name: Check formatting
        run: git diff --check

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify generated universal APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/debug -type f -name '*.apk' | sort)
          apk_count=${#apks[@]}
          echo "Found $apk_count debug APK(s)"
          test "$apk_count" -eq 1
          apk="${apks[0]}"
          case "$apk" in
            *universal*|*debug*) : ;;
            *) echo "Unexpected APK name: $apk"; exit 1 ;;
          esac
          file "$apk"
          du -h "$apk"

          # A universal direct-distribution APK must actually contain both ARM ABIs.
          unzip -l "$apk" > apk-contents.txt
          grep -q 'lib/armeabi-v7a/' apk-contents.txt
          grep -q 'lib/arm64-v8a/' apk-contents.txt
          echo 'Verified native libraries for armeabi-v7a and arm64-v8a.'
          echo "Universal APK verified: $apk"

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-browser-universal-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
