name: Build Universal Browser

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Verify Gradle
        run: gradle --version

      - name: Apply comprehensive browser upgrade
        run: python3 tools/mega_upgrade.py

      - name: Apply product browser upgrade
        run: python3 tools/product_upgrade.py

      - name: Apply real tab/session architecture
        run: python3 tools/tab_upgrade.py

      - name: Validate tab state integration
        run: python3 tools/tab_state_fix.py

      - name: Apply extension-to-tab integration
        run: python3 tools/extension_tab_upgrade.py

      - name: Validate extension-to-tab integration
        run: |
          set -euo pipefail
          grep -q 'private lateinit var extensionTabBridge: ExtensionTabBridge' app/src/main/java/com/coeric/universalbrowser/MainActivity.kt
          grep -q 'extensionTabBridge.bindSession(target)' app/src/main/java/com/coeric/universalbrowser/MainActivity.kt
          grep -q 'extensionTabBridge.notifyActive(session)' app/src/main/java/com/coeric/universalbrowser/MainActivity.kt
          grep -q 'override fun onNewTab' app/src/main/java/com/coeric/universalbrowser/ExtensionTabBridge.kt
          grep -q 'override fun onUpdateTab' app/src/main/java/com/coeric/universalbrowser/ExtensionTabBridge.kt
          grep -q 'override fun onCloseTab' app/src/main/java/com/coeric/universalbrowser/ExtensionTabBridge.kt
          echo 'Extension-to-tab integration anchors validated.'

      - name: Apply advanced browser upgrade
        run: python3 tools/advanced_upgrade.py

      - name: Validate source formatting
        run: git diff --check

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          apk_count=$(find app/build/outputs/apk/debug -type f -name '*.apk' | wc -l)
          echo "APK count: $apk_count"
          test "$apk_count" -ge 1
          find app/build/outputs/apk/debug -type f -name '*.apk' -print -exec file {} \; -exec du -h {} \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-browser-comprehensive-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
