name: Build Universal Browser

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universal-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Verify Gradle
        run: gradle --version

      - name: Apply comprehensive browser upgrade
        run: python3 tools/mega_upgrade.py

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          apk_count=$(find app/build/outputs/apk/debug -type f -name '*.apk' | wc -l)
          echo "APK count: $apk_count"
          test "$apk_count" -ge 1
          find app/build/outputs/apk/debug -type f -name '*.apk' -print -exec file {} \; -exec du -h {} \;

      - name: Commit comprehensive browser upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/coeric/universalbrowser/MainActivity.kt app/src/main/java/com/coeric/universalbrowser/BrowserDataStore.kt app/src/main/java/com/coeric/universalbrowser/AiAssistantView.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "feat: comprehensive browser core and native AI foundation"
            git push origin HEAD:main
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-browser-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
