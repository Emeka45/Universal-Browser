name: Universal Browser Mega Build

on: push

permissions:
  contents: write

jobs:
  upgrade-build-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply mega upgrade
        run: python3 tools/mega_upgrade.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          file "$apk"
          du -h "$apk"

      - name: Commit source upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/coeric/universalbrowser/MainActivity.kt app/src/main/java/com/coeric/universalbrowser/BrowserDataStore.kt app/src/main/java/com/coeric/universalbrowser/AiAssistantView.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "feat: comprehensive browser core and native AI foundation"
            git push origin HEAD:main
          fi

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-browser-mega-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
