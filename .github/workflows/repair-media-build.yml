name: Repair Media Build Source

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[media-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply safe media-build fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/coeric/universalbrowser/MainActivity.kt')
          s = p.read_text()
          old = 'session.getWebExtensionController().setMessageDelegate(extension, mediaMessageDelegate, NATIVE_APP_NAME)'
          new = 'extension?.let { session.getWebExtensionController().setMessageDelegate(it, mediaMessageDelegate, NATIVE_APP_NAME) }'
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace('            request.addRequestHeader("User-Agent", getRuntimeUserAgent())\n', '')
          s = s.replace('\n    private fun getRuntimeUserAgent(): String = "Mozilla/5.0 (Linux; Android) UniversalBrowser"\n', '\n')
          p.write_text(s)

      - name: Commit source repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/coeric/universalbrowser/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No repair needed."
            exit 0
          fi
          git commit -m "Fix media detector nullable extension and download UA [media-repair]"
          git push
