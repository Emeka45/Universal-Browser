name: Repair and Build Redmi A1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Repair Kotlin listener signature
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/coeric/universalbrowser/MainActivity.kt')
          s = p.read_text()
          old = '                    .setOnCancelListener { result.complete(WebExtension.PermissionPromptResponse(false)) }'
          new = '                    .setOnCancelListener { _ -> result.complete(WebExtension.PermissionPromptResponse(false)) }'
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print('Fixed AlertDialog cancel-listener lambda.')
          else:
              print('Cancel-listener pattern already fixed; no source change needed.')
          PY

      - name: Commit repair to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/coeric/universalbrowser/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No repair commit required.'
          else
            git commit -m 'Fix extension permission dialog build error'
            git push origin HEAD:main
          fi

      - name: Build Redmi A1 ARMv7 debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --info

      - name: Verify generated APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "APK=$APK"

      - name: Upload repaired APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-browser-redmi-a1-repaired
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
